services:
  - type: web
    name: ayuctms-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ayuctms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PII_KEY
        generateValue: true
      - key: ACCESS_TTL_MIN
        value: "60"
      - key: REFRESH_TTL_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: ENABLE_SCHEDULER
        value: "true"

databases:
  - name: ayuctms-db
    databaseName: ayuctms
    user: ayuctms_app
    plan: free
