<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#0A0F0D"/>

  <!-- Subtle centre glow -->
