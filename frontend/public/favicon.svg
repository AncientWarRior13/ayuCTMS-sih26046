    <path d="M16 3.5 L17 8 L16 11 L15 8Z" fill="#101815" stroke="#C8A45C" stroke-width="0.7"/>
    <circle cx="16" cy="3.8" r="1" fill="#2FB39A"/>
  </g>
  <g transform="rotate(45 16 16)">
    <path d="M16 3.5 L17 8 L16 11 L15 8Z" fill="#101815" stroke="#C8A45C" stroke-width="0.7"/>
